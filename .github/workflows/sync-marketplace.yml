name: Sync Marketplace

# Gated on CI passing — never publishes a commit that failed validation.
# Sync is idempotent (skips if marketplace already matches), so it's safe
# to fire on every successful CI run, not just version-changing pushes.
# workflow_dispatch is provided as a manual escape hatch.
on:
  workflow_run:
    workflows: ["Validate Plugin"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    steps:
      - name: Checkout ido4dev (the SHA CI validated)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          path: source

      - name: Read version from plugin.json
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('source/.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      # MARKETPLACE_TOKEN is a PAT scoped to the ido4-plugins repo.
      # If this step fails with HTTP 401/403, the token has likely expired —
      # regenerate at github.com/settings/tokens and update the repo secret.
      - name: Checkout ido4-plugins marketplace
        uses: actions/checkout@v5
        with:
          repository: ido4-dev/ido4-plugins
          token: ${{ secrets.MARKETPLACE_TOKEN }}
          path: marketplace

      # Vendor the plugin's runtime files into the marketplace (mirrors the
      # ido4specs/ido4shape pattern). The marketplace ships a COPY of each
      # plugin; without this step the catalogued plugins/ido4dev/ would go stale
      # on every release (this step previously only bumped the version string).
      - name: Sync plugin directory
        run: |
          rm -rf marketplace/plugins/ido4dev
          mkdir -p marketplace/plugins/ido4dev
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='docs' \
            --exclude='drafts' \
            --exclude='reports' \
            --exclude='*.plan.md' \
            --exclude='node_modules' \
            --exclude='tests' \
            source/ marketplace/plugins/ido4dev/
          echo "Synced plugin directory"

      - name: Update marketplace manifest
        run: |
          python3 -c "
          import json
          plugin_path = 'source/.claude-plugin/plugin.json'
          market_path = 'marketplace/.claude-plugin/marketplace.json'
          plugin = json.load(open(plugin_path))
          d = json.load(open(market_path))
          for p in d['plugins']:
              if p['name'] == 'ido4dev':
                  p['version'] = plugin['version']
                  p['description'] = plugin.get('description', p.get('description', ''))
                  # Fields shared by plugin.json and the marketplace entry schema.
                  # NOT synced: 'category'/'tags' are marketplace-specific (not in
                  # plugin.json), so they stay authored in marketplace.json.
                  for field in ('homepage', 'repository', 'license', 'keywords', 'author'):
                      if field in plugin:
                          p[field] = plugin[field]
          json.dump(d, open(market_path, 'w'), indent=2)
          "
          echo "Updated marketplace.json to v${{ steps.version.outputs.version }}"

      - name: Commit and push marketplace
        run: |
          cd marketplace
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
            exit 0
          fi
          git commit -m "sync ido4dev v${{ steps.version.outputs.version }}"
          # Retry with rebase to handle concurrent pushes from sibling sync
          # workflows. Multiple plugin repos sync to the same ido4-plugins/main;
          # without retry, whichever job pushes second loses the race.
          attempt=1
          until git push; do
            if [ "$attempt" -ge 5 ]; then
              echo "::error::Push failed after 5 attempts"
              exit 1
            fi
            echo "Push rejected (attempt $attempt/5) — fetching and rebasing"
            sleep $((attempt * 2))
            if ! git pull --rebase; then
              echo "::error::Rebase conflict — concurrent edits touched overlapping content"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
            attempt=$((attempt + 1))
          done

      - name: Create GitHub Release
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v${{ steps.version.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — skipping"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --latest
          fi
